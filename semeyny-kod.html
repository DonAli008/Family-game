/* Layout: one dark game-show world — TV screen in wide grids, phone screens as a single column of big touch targets. Ikat stripe = Uzbek dastarkhan cloth. */
:root{
  color-scheme: dark;
  --ink:#130F26; --panel:#1E1840; --panel2:#2A2256; --line:#3D3374;
  --text:#F6F2FF; --muted:#ABA1D4; --dim:#7D72A8;
  --saffron:#F7B538; --pom:#E8476B; --turq:#2EC4B6;
  --ok:#2BB673; --bad:#E5484D;
  --a0:#E5484D; --a1:#2F7BEA; --a2:#E9A80F; --a3:#1F9D63; --on-yellow:#1C1400;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'Golos Text',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font:400 16px/1.45 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
#app{min-height:100%;display:flex;flex-direction:column;gap:16px;padding-block:16px;max-width:1600px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit}
:focus-visible{outline:3px solid var(--saffron);outline-offset:3px}
.ikat{height:12px;border-radius:6px;flex:none;
  background:
   linear-gradient(135deg,var(--saffron) 25%,transparent 25%) -12px 0/24px 24px,
   linear-gradient(225deg,var(--pom) 25%,transparent 25%) -12px 0/24px 24px,
   linear-gradient(315deg,var(--turq) 25%,transparent 25%) 0 0/24px 24px,
   linear-gradient(45deg,var(--saffron) 25%,var(--panel2) 25%) 0 0/24px 24px}
.muted{color:var(--muted)}
.label{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spread{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.btn{border:0;border-radius:14px;padding:14px 22px;font-weight:700;font-size:18px;cursor:pointer;
  background:var(--saffron);color:var(--on-yellow);transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line)}
.btn.small{padding:8px 14px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--panel2);
  border:1px solid var(--line);font-weight:600;font-size:15px;white-space:nowrap}
.chip.ok{border-color:var(--ok)}
.chip.team0{background:color-mix(in srgb,var(--pom) 22%,var(--panel));border-color:var(--pom)}
.chip.team1{background:color-mix(in srgb,var(--turq) 22%,var(--panel));border-color:var(--turq)}
input{font:600 20px var(--body);width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--line);
  background:var(--panel2);color:var(--text)}
input:focus{outline:none;border-color:var(--saffron)}
.logo{font-family:var(--display);font-weight:800;line-height:1;letter-spacing:-.02em}
.logo b{color:var(--saffron);font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--saffron);padding:12px 18px;border-radius:14px;z-index:50;max-width:90vw;text-align:center}

/* role picker */
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.role{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:22px;cursor:pointer;color:var(--text)}
.role:hover{border-color:var(--saffron)}
.role .big{font-size:40px;line-height:1}
.role h3{font-size:20px;margin:10px 0 6px}

/* TV */
.tv{flex:1;display:flex;flex-direction:column;gap:clamp(12px,2vh,24px);padding-bottom:56px}
.tv-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.tv-top .grow{flex:1}
.code{font-family:var(--display);font-weight:800;font-size:clamp(56px,11vw,150px);line-height:1;letter-spacing:.06em;color:var(--saffron);font-variant-numeric:tabular-nums}
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;flex:1}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;align-content:start}
.pcard{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pcard.ready{border-color:var(--ok)}
.pcard .nm{font-weight:700;font-size:20px;overflow-wrap:anywhere}
.pcard .th{font-size:22px;letter-spacing:4px}
.off{opacity:.45}
.qtext{font-family:var(--display);font-weight:700;font-size:clamp(24px,3.6vw,58px);line-height:1.15;text-wrap:balance}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.4vw,18px)}
.opt{display:flex;align-items:center;gap:16px;border-radius:16px;padding:clamp(14px,2vh,26px) clamp(14px,1.6vw,26px);
  font-weight:700;font-size:clamp(18px,2.2vw,34px);line-height:1.2;color:#fff;min-width:0;transition:opacity .3s,transform .3s}
.opt .sh{font-size:1.1em;flex:none;width:1.2em;text-align:center}
.opt .tx{min-width:0;overflow-wrap:anywhere}
.opt .cnt{margin-left:auto;font-size:.75em;background:rgba(0,0,0,.25);border-radius:999px;padding:2px 12px;flex:none}
.o0{background:var(--a0)}.o1{background:var(--a1)}.o2{background:var(--a2);color:var(--on-yellow)}.o3{background:var(--a3)}
.opt.dim{opacity:.28}
.opt.win{transform:scale(1.02);box-shadow:0 0 0 4px var(--text)}
.timer{height:10px;border-radius:5px;background:var(--panel2);overflow:hidden}
.timer i{display:block;height:100%;background:var(--saffron);width:100%;transition:width .25s linear}
.tleft{font-family:var(--display);font-weight:800;font-size:clamp(22px,2.6vw,40px);font-variant-numeric:tabular-nums;min-width:2.2em;text-align:right}
.facegrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:center;flex:1}
.face{width:100%;max-height:62vh;object-fit:contain;border-radius:18px;background:var(--panel)}
.facegrid .opts{grid-template-columns:1fr}
.results{display:flex;flex-wrap:wrap;gap:10px}
.res{display:inline-flex;gap:8px;align-items:center;padding:8px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:clamp(15px,1.4vw,22px)}
.res.good{border-color:var(--ok)}.res.miss{opacity:.6}
.res .pts{color:var(--saffron);font-variant-numeric:tabular-nums}
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;max-width:1100px}
.intro .num{font-family:var(--display);font-weight:800;color:var(--saffron);font-size:clamp(18px,2vw,28px)}
.intro h1{font-size:clamp(40px,7vw,110px);line-height:1}
.intro ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:10px;font-size:clamp(18px,2.1vw,32px);max-width:62ch}
.board{display:flex;flex-direction:column;gap:10px;max-width:1100px;width:100%}
.brow{display:grid;grid-template-columns:3ch minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 18px;font-size:clamp(18px,2vw,30px);font-weight:600}
.brow .rk{font-family:var(--display);color:var(--saffron)}
.brow .sc{font-variant-numeric:tabular-nums;font-family:var(--display)}
.brow .nm{overflow-wrap:anywhere}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.team{border-radius:18px;padding:18px;border:2px solid}
.team.t0{border-color:var(--pom);background:color-mix(in srgb,var(--pom) 14%,var(--ink))}
.team.t1{border-color:var(--turq);background:color-mix(in srgb,var(--turq) 14%,var(--ink))}
.team h3{font-size:clamp(20px,2.4vw,36px)}
.tiles{display:flex;gap:clamp(6px,1vw,14px);flex-wrap:wrap;justify-content:center}
.tile{width:clamp(34px,8vw,110px);aspect-ratio:3/4;border-radius:12px;display:grid;place-items:center;
  font-family:var(--display);font-weight:800;font-size:clamp(22px,5vw,72px);background:var(--panel2);border:2px solid var(--line);color:var(--saffron)}
.tile.open{background:var(--saffron);color:var(--on-yellow);border-color:var(--saffron)}
.tile.flip{animation:flip .6s both}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
.podium{display:flex;gap:16px;align-items:flex-end;justify-content:center;flex-wrap:wrap}
.pod{background:var(--panel);border:2px solid var(--line);border-radius:18px 18px 0 0;padding:18px;min-width:160px;text-align:center;display:flex;flex-direction:column;gap:6px;justify-content:flex-end}
.pod.p1{border-color:var(--saffron);min-height:280px}.pod.p2{min-height:220px}.pod.p3{min-height:180px}
.pod .medal{font-family:var(--display);font-size:42px;color:var(--saffron)}
.pod .nm{font-weight:700;font-size:24px;overflow-wrap:anywhere}
.ctrl{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:20;opacity:.55}
.ctrl:hover,.ctrl:focus-within{opacity:1}

/* phone */
.phone{max-width:520px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;gap:14px}
.ph-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.ph-head .nm{font-weight:700;overflow-wrap:anywhere;min-width:0}
.ph-head .sc{font-family:var(--display);color:var(--saffron);font-variant-numeric:tabular-nums;flex:none}
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:16px 12px;cursor:pointer;color:var(--text);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.theme .ic{font-size:34px;line-height:1}
.theme .tn{font-weight:700}
.theme[aria-pressed="true"]{border-color:var(--saffron);background:color-mix(in srgb,var(--saffron) 16%,var(--panel))}
.pad{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:300px}
.pad button{border:0;border-radius:18px;font-size:54px;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:10px}
.pad button .tx{font-size:17px;font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.pad button.o2{color:var(--on-yellow)}
.pad button.sel{box-shadow:0 0 0 5px var(--text) inset}
.pad.locked button:not(.sel){opacity:.25}
.banner{border-radius:14px;padding:12px 14px;font-weight:600;background:var(--panel2);border:1px solid var(--line)}
.banner.own{border-color:var(--ok)}
.banner.t0{border-color:var(--pom)}.banner.t1{border-color:var(--turq)}
.bigmsg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px}
.bigmsg .emo{font-size:64px;line-height:1}
.bigmsg h2{font-size:28px}
.mytiles{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.mytiles .tile{width:52px;font-size:28px}
.newletter{border:2px dashed var(--saffron);border-radius:14px;padding:12px;text-align:center;font-weight:700}
.rm-list{display:flex;flex-direction:column;gap:8px}
.rm-p{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}
.dot.off{background:var(--bad);opacity:1}
.answer-key{border-left:4px solid var(--ok);padding:8px 12px;background:var(--panel2);border-radius:0 10px 10px 0}

@media (max-width:820px){
  .lobby,.facegrid,.teams{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

function loadScript(urls){
  return new Promise((res, rej) => {
    let i = 0;
    const next = () => {
      if (i >= urls.length) return rej(new Error('load'));
      const s = document.createElement('script'); s.src = urls[i++];
      s.onload = res; s.onerror = () => { s.remove(); next(); };
      document.head.appendChild(s);
    };
    next();
  });
}

/* ================= NETWORK ================= */
// Screen side: accepts connections from phones.
function createHub(code, h){
  if (LOCAL){
    const bc = new BroadcastChannel(PREFIX + code);
    bc.onmessage = e => { const m = e.data; if (m.to !== 'hub') return; if (m.type === 'bye') h.onLeave(m.from); else h.onMsg(m.from, m.data); };
    setTimeout(() => h.onOpen(code));
    return { send(cid, d){ bc.postMessage({to:cid, data:d}); }, isOpen(){ return true; } };
  }
  const conns = new Map(); let peer, opened = false;
  const start = c => {
    peer = new Peer(PREFIX + c, {debug:0});
    peer.on('open', () => { opened = true; h.onOpen(c); });
    peer.on('connection', conn => {
      conn.on('data', d => { conns.set(conn.peer, conn); h.onMsg(conn.peer, d); });
      conn.on('close', () => { if (conns.get(conn.peer) === conn){ conns.delete(conn.peer); h.onLeave(conn.peer); } });
      conn.on('error', () => {});
    });
    peer.on('error', err => {
      if (err.type === 'unavailable-id'){ try { peer.destroy(); } catch(e){} start(randomCode()); }
      else if (!opened) h.onFail(err);
    });
    peer.on('disconnected', () => { setTimeout(() => { try { if (!peer.destroyed) peer.reconnect(); } catch(e){} }, 1000); });
  };
  start(code);
  return { send(cid, d){ const c = conns.get(cid); if (c && c.open){ try { c.send(d); } catch(e){} } }, isOpen(){ return opened; } };
}
// Phone side: connects to the screen, reconnects on its own.
function createLink(code, h){
  if (LOCAL){
    const id = 'c' + Math.random().toString(36).slice(2, 8);
    const bc = new BroadcastChannel(PREFIX + code);
    bc.onmessage = e => { if (e.data.to === id) h.onMsg(e.data.data); };
    window.addEventListener('beforeunload', () => bc.postMessage({to:'hub', from:id, type:'bye'}));
    setTimeout(() => { h.onStatus('open'); h.onOpen(); });
    return { send(d){ bc.postMessage({to:'hub', from:id, data:d}); }, poke(){} };
  }
  let peer, conn, timer = null, lastSeen = now();
  const schedule = ms => { clearTimeout(timer); timer = setTimeout(connect, ms); };
  function connect(){
    if (!peer || peer.destroyed) return;
    if (peer.disconnected){ try { peer.reconnect(); } catch(e){} schedule(1500); return; }
    try { conn && conn.close(); } catch(e){}
    h.onStatus('connecting');
    const c = conn = peer.connect(PREFIX + code, {reliable:true});
    c.on('open', () => { if (c !== conn) return; lastSeen = now(); h.onStatus('open'); h.onOpen(); });
    c.on('data', d => { if (c !== conn) return; lastSeen = now(); h.onMsg(d); });
    c.on('close', () => { if (c !== conn) return; h.onStatus('lost'); schedule(1500); });
    c.on('error', () => {});
  }
  peer = new Peer({debug:0});
  peer.on('open', connect);
  peer.on('error', err => {
    if (err.type === 'peer-unavailable'){ h.onStatus('nohost'); schedule(2500); }
    else if (err.type === 'browser-incompatible') h.onStatus('incompatible');
    else schedule(2500);
  });
  peer.on('disconnected', () => schedule(1500));
  // if the screen has been silent too long (phone slept), reconnect
  setInterval(() => { if (conn && conn.open && now() - lastSeen > 12000){ h.onStatus('lost'); connect(); } }, 3000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && now() - lastSeen > 6000) connect(); });
  return { send(d){ if (conn && conn.open){ try { conn.send(d); } catch(e){} } }, poke(){ if (!conn || !conn.open) connect(); } };
}
const randomCode = () => String(Math.floor(1000 + Math.random() * 9000));

  <div class="stack" style="gap:6px">
    <h1 class="logo" style="font-size:clamp(40px,9vw,96px)">Семейный <b>код</b></h1>
    <p class="muted" style="font-size:18px">Квиз для всей семьи: экран на телевизоре, ответы на телефонах.</p>
  </div>
  <div class="roles">
    <button class="role" id="r-screen"><div class="big">📺</div><h3>Экран</h3><p class="muted">Откройте на телевизоре или ноутбуке. Здесь вопросы и таблица.</p></button>
    <button class="role" id="r-remote"><div class="big">🎮</div><h3>Пульт ведущего</h3><p class="muted">Телефон ведущего: кнопка «Далее», ответы и команды.</p></button>
    <button class="role" id="r-player"><div class="big">📱</div><h3>Игрок</h3><p class="muted">Каждый игрок открывает на своём телефоне.</p></button>
  </div>
  ${IN_FRAME && !LOCAL ? '<p class="panel muted">Это предпросмотр. Здесь работает только «Экран» с ботами. Для настоящей игры откройте файл игры по своей ссылке.</p>' : ''}`;
  document.getElementById('r-screen').onclick = startScreen;
  document.getElementById('r-remote').onclick = () => startClient('remote');
  document.getElementById('r-player').onclick = () => startClient('player');
}

/* ================= SCREEN (authoritative game state) ================= */
let S = null, hub = null, botTimers = [];
function newState(code){
  return { code, phase:'lobby', stage:0, players:[], cids:{}, remotes:new Set(), queue:[], qi:0, q:null,
    answers:{}, deadline:0, last:null, pub:[], faceRight:0, solved:[], netError:null };
}
function buildQ(row){
  const [theme, stage, hard, q, ...opts] = row;
  const order = shuffle([0,1,2,3]);
  return { theme, stage, hard:!!hard, q, opts: order.map(i => opts[i]), c: order.indexOf(0) };
}
function interleave(groups){ const out = []; const gs = groups.map(g => shuffle(g)); let added = true; while (added){ added = false; for (const g of shuffle(gs)){ if (g.length){ out.push(g.shift()); added = true; } } } return out; }
function buildQueue(stage){
  if (stage === 3) return shuffle(FACES).map(f => { const order = shuffle([1,2,3,4]); return { face:f[0], q:'Кто это?', opts: order.map(i => f[i]), c: order.indexOf(1) }; });
  let rows = QUESTIONS.filter(r => r[1] === stage);
  if (stage === 1){ const chosen = new Set(S.players.flatMap(p => p.themes)); if (chosen.size) rows = rows.filter(r => chosen.has(r[0])); }
  const byTheme = Object.keys(THEMES).map(t => rows.filter(r => r[0] === t).map(buildQ)).filter(g => g.length);
  return interleave(byTheme);
}
const online = p => p.bot || (p.cid && now() - p.last < 12000);
const active = () => S.players.filter(online);
const teamOf = t => S.players.filter(p => p.team === t);

function startScreen(){
  S = newState(randomCode());
  renderScreen();
  setInterval(tick, 250);
  if (LOCAL){ hub = createHub(S.code, hubHandlers()); return; }
  if (IN_FRAME){ S.preview = true; renderScreen(); return; }
  loadPeer().then(() => { hub = createHub(S.code, hubHandlers()); })
    .catch(() => { S.netError = 'Не удалось загрузить модуль связи. Проверьте интернет и обновите страницу.'; renderScreen(); });
  loadScript(['https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js']).then(renderScreen).catch(() => {});
  setInterval(() => { for (const cid of Object.keys(S.cids)) hub && hub.send(cid, {t:'hb'}); for (const cid of S.remotes) hub && hub.send(cid, {t:'hb'}); if (S.phase === 'lobby' || S.phase === 'board') renderScreen(); }, 4000);
}
function hubHandlers(){
  return {
    onOpen(code){ S.code = code; S.netError = null; renderScreen(); },
    onFail(err){ S.netError = 'Нет связи с сервером игры (' + (err && err.type || 'ошибка') + '). Проверьте интернет. Тест-режим с ботами работает и без связи.'; renderScreen(); },
    onLeave(cid){ const k = S.cids[cid]; if (k){ const p = S.players.find(x => x.key === k); if (p && p.cid === cid) p.last = 0; } S.remotes.delete(cid); sync(); },
    onMsg(cid, m){ handleMsg(cid, m); }
  };
}

function handleMsg(cid, m){
  if (!m || typeof m !== 'object') return;
  if (m.t === 'ping'){ const p = byCid(cid); if (p) p.last = now(); return; }
  if (m.t === 'join'){
    if (m.role === 'remote'){ S.remotes.add(cid); sync(); return; }
    const name = String(m.name || '').trim().slice(0, 20); const key = keyOf(name);
    if (!key) return hub.send(cid, {t:'err', m:'Введите имя'});
    let p = S.players.find(x => x.key === key);
    if (p && !p.bot && p.cid !== cid && online(p) && m.pid !== p.pid) return hub.send(cid, {t:'err', m:'Имя «' + name + '» уже занято. Добавьте букву или эмодзи.'});
    if (!p){
      if (S.phase !== 'lobby' && S.players.length >= 12) return hub.send(cid, {t:'err', m:'Игра уже идёт'});
      p = { key, name, pid:m.pid, cid, last:now(), themes:[], ready:false, team:null, score:0, correct:0, letters:[], bot:false, gain:0, right:null, ans:null, newLetter:null, attempts:0, solvedAt:null, bonus:0 };
      if (S.phase !== 'lobby'){ p.themes = Object.keys(THEMES); p.ready = true; if (S.stage >= 2) p.team = teamOf(0).length <= teamOf(1).length ? 0 : 1; }
      S.players.push(p);
    }
    p.cid = cid; p.pid = m.pid; p.last = now(); S.cids[cid] = key;
    sync(); return;
  }
  if (S.remotes.has(cid)){
    if (m.t === 'cmd'){
      if (m.c === 'next') next();
      else if (m.c === 'team'){ const p = S.players.find(x => x.key === m.key); if (p){ p.team = p.team === 0 ? 1 : 0; sync(); } }
      else if (m.c === 'shuffleTeams'){ assignTeams(true); sync(); }
      else if (m.c === 'bots') addBots();
      else if (m.c === 'kick'){ S.players = S.players.filter(x => x.key !== m.key); sync(); }
    }
    return;
  }
  const p = byCid(cid); if (!p) return; p.last = now();
  if (m.t === 'themes' && S.phase === 'lobby'){ p.themes = (m.themes || []).filter(t => THEMES[t]); p.ready = !!m.ready && p.themes.length > 0; sync(); }
  else if (m.t === 'answer') answer(p, m.c|0);
  else if (m.t === 'guess') guess(p, m.word);
}
const byCid = cid => { const k = S.cids[cid]; return k ? S.players.find(x => x.key === k) : null; };

function assignTeams(random){
  const list = random ? shuffle(S.players) : S.players.slice().sort((a,b) => b.score - a.score);
  // snake draft: 1→A, 2→B, 3→B, 4→A, 5→A ...
  list.forEach((p, i) => { const r = i % 4; p.team = (r === 0 || r === 3) ? 0 : 1; });
}

function next(){
  clearBots();
  switch (S.phase){
    case 'lobby':
      if (!S.players.length){ toast('Ждём хотя бы одного игрока'); return; }
      S.players.forEach(p => { if (!p.themes.length) p.themes = Object.keys(THEMES); });
      S.stage = 1; S.queue = buildQueue(1); S.qi = 0; S.phase = 'intro'; break;
    case 'intro':
      if (S.stage === 4) startFinal(); else startQuestion();
      break;
    case 'q': reveal(); break;
    case 'reveal':
      if (S.qi + 1 < S.queue.length){ S.qi++; startQuestion(); }
      else if (S.stage === 1){ assignTeams(false); S.phase = 'board'; }
      else if (S.stage === 2){ S.phase = 'board'; }
      else { S.stage = 4; S.phase = 'intro'; }
      break;
    case 'board':
      S.stage++; S.queue = buildQueue(S.stage); S.qi = 0; S.phase = 'intro'; break;
    case 'final': finishFinal(); break;
    case 'finalReveal': S.phase = 'end'; break;
    default: return;
  }
  sync();
}
function startQuestion(){
  S.q = S.queue[S.qi]; S.answers = {}; S.last = null;
  const T = S.stage === 3 ? T_FACE : T_Q;
  S.deadline = now() + T * 1000; S.qT = T; S.phase = 'q';
  S.players.forEach(p => { p.gain = 0; p.right = null; p.ans = null; p.newLetter = null; });
  scheduleBots();
}
function answer(p, c){
  if (S.phase !== 'q' || c < 0 || c > 3) return;
  if (S.stage === 1){ if (S.answers[p.key]) return; S.answers[p.key] = {c, t:now()}; }
  else if (S.stage === 2){ if (p.team == null) return; const k = 'T' + p.team; if (S.answers[k]) return; S.answers[k] = {c, t:now(), by:p.name}; }
  else if (S.stage === 3){ S.answers[p.key] = {c, t:(S.answers[p.key] && S.answers[p.key].t) || now()}; }
  if (allAnswered()) reveal(); else sync();
}
function allAnswered(){
  const act = active(); if (!act.length) return false;
  if (S.stage === 2){ const teams = [...new Set(act.map(p => p.team).filter(t => t != null))]; return teams.every(t => S.answers['T' + t]); }
  return act.every(p => S.answers[p.key]);
}
function giveLetter(p){
  if (p.letters.length >= MAX_LETTERS) return null;
  const free = [...WORD].map((_, i) => i).filter(i => !p.letters.includes(i));
  const pos = free[Math.floor(Math.random() * free.length)]; p.letters.push(pos); return pos;
}
function speedPoints(a){ const frac = Math.max(0, Math.min(1, (S.deadline - a.t) / (S.qT * 1000))); return Math.round(100 + 50 * frac); }
function addCorrect(p){ p.correct++; if (p.correct % PER_LETTER === 0) p.newLetter = giveLetter(p); }
function reveal(){
  if (S.phase !== 'q') return;
  clearBots();
  const q = S.q;
  if (S.stage === 1){
    S.players.forEach(p => { const a = S.answers[p.key]; p.ans = a ? a.c : null; p.right = !!a && a.c === q.c;
      if (p.right){ const base = speedPoints(a); p.gain = p.themes.includes(q.theme) ? base : Math.round(base / 2); p.score += p.gain; addCorrect(p); } });
  } else if (S.stage === 2){
    const teamRes = {};
    [0,1].forEach(t => { const a = S.answers['T' + t]; teamRes[t] = a ? {c:a.c, right:a.c === q.c, by:a.by, pts:a.c === q.c ? speedPoints(a) : 0} : null; });
    S.players.forEach(p => { const r = teamRes[p.team]; p.ans = r ? r.c : null; p.right = !!r && r.right; if (p.right){ p.gain = r.pts; p.score += p.gain; addCorrect(p); } });
    S.last = {teamRes};
  } else if (S.stage === 3){
    const counts = [0,0,0,0]; const first = [Infinity,Infinity,Infinity,Infinity];
    Object.values(S.answers).forEach(a => { counts[a.c]++; first[a.c] = Math.min(first[a.c], a.t); });
    let maj = -1; counts.forEach((n, i) => { if (n > 0 && (maj < 0 || n > counts[maj] || (n === counts[maj] && first[i] < first[maj]))) maj = i; });
    const groupRight = maj === q.c; let opened = null;
    if (groupRight){ S.faceRight++; if (S.faceRight % FACES_PER_LETTER === 0 && S.pub.length < MAX_PUBLIC){ const free = [...WORD].map((_, i) => i).filter(i => !S.pub.includes(i)); opened = free[Math.floor(Math.random() * free.length)]; S.pub.push(opened); } }
    S.players.forEach(p => { const a = S.answers[p.key]; p.ans = a ? a.c : null; p.right = !!a && a.c === q.c; if (p.right){ p.gain = 50; p.score += 50; } });
    S.last = {counts, maj, groupRight, opened};
  }
  S.phase = 'reveal'; sync();
}
function startFinal(){
  S.phase = 'final'; S.deadline = now() + T_FINAL * 1000; S.qT = T_FINAL; S.solved = [];
  S.players.forEach(p => { p.attempts = 0; p.solvedAt = null; p.bonus = 0; p.lastWrong = null; });
  scheduleBots();
}
function guess(p, word){
  if (S.phase !== 'final' || p.solvedAt || p.attempts >= 3) return;
  p.attempts++;
  if (norm(word) === WORD){ p.solvedAt = now(); p.bonus = [1000,600,300][S.solved.length] || 100; p.score += p.bonus; S.solved.push(p.key); }
  else p.lastWrong = String(word || '').slice(0, 20);
  const act = active();
  if (act.length && act.every(x => x.solvedAt || x.attempts >= 3)) finishFinal(); else sync();
}
function finishFinal(){ if (S.phase !== 'final') return; clearBots(); S.phase = 'finalReveal'; sync(); }
function tick(){
  if (!S) return;
  if ((S.phase === 'q' || S.phase === 'final') && now() >= S.deadline){ if (S.phase === 'q') reveal(); else finishFinal(); return; }
  if (S.phase === 'q' || S.phase === 'final'){
    const left = Math.max(0, S.deadline - now());
    const bar = document.getElementById('tbar'); if (bar) bar.style.width = (100 * left / (S.qT * 1000)) + '%';
    const tl = document.getElementById('tleft'); if (tl) tl.textContent = Math.ceil(left / 1000);
  }
}

/* --- test bots (only live on the screen) --- */
const BOT_NAMES = ['Бот Алия','Бот Тимур','Бот Зарина'];
function addBots(){
  BOT_NAMES.forEach(n => { if (S.players.some(p => p.key === keyOf(n))) return;
    const th = shuffle(Object.keys(THEMES)).slice(0, 1 + Math.floor(Math.random() * 3));
    S.players.push({ key:keyOf(n), name:n, bot:true, cid:null, last:0, themes:th, ready:true, team:null, score:0, correct:0, letters:[], gain:0, right:null, ans:null, newLetter:null, attempts:0, solvedAt:null, bonus:0 }); });
  if (S.stage >= 2) S.players.forEach(p => { if (p.team == null) p.team = teamOf(0).length <= teamOf(1).length ? 0 : 1; });
  toast('Добавлены 3 бота для проверки'); sync();
}
function clearBots(){ botTimers.forEach(clearTimeout); botTimers = []; }
function scheduleBots(){
  S.players.filter(p => p.bot).forEach(p => {
    if (S.phase === 'q'){
      const wait = 2000 + Math.random() * (S.qT * 1000 * 0.6);
      botTimers.push(setTimeout(() => { if (S.phase !== 'q') return; const c = Math.random() < 0.6 ? S.q.c : (S.q.c + 1 + Math.floor(Math.random() * 3)) % 4; answer(p, c); }, wait));
    } else if (S.phase === 'final'){
      botTimers.push(setTimeout(() => { if (S.phase === 'final') guess(p, 'ДАСТАРХОН'); }, 6000 + Math.random() * 15000));
      if (Math.random() < 0.6) botTimers.push(setTimeout(() => { if (S.phase === 'final') guess(p, WORD); }, 25000 + Math.random() * 40000));
    }
  });
}

/* --- views sent to phones --- */
function ranking(){ return S.players.slice().sort((a,b) => b.score - a.score); }
function rankOf(p){ return ranking().findIndex(x => x.key === p.key) + 1; }
function playerView(p){
  const v = { t:'v', role:'player', phase:S.phase, stage:S.stage, name:p.name, score:p.score, themes:p.themes, ready:p.ready,
    team:p.team, letters:p.letters.map(i => WORD[i]), rank:rankOf(p), total:S.players.length, toLetter: p.letters.length >= MAX_LETTERS ? 0 : PER_LETTER - (p.correct % PER_LETTER) };
  if (S.phase === 'q' || S.phase === 'final') v.left = Math.max(0, S.deadline - now());
  if (S.phase === 'q'){
    v.qn = S.qi + 1; v.qt = S.queue.length; v.theme = S.q.theme;
    if (S.stage === 1){ v.own = p.themes.includes(S.q.theme); const a = S.answers[p.key]; v.mine = a ? a.c : null; }
    if (S.stage === 2){ const a = S.answers['T' + p.team]; v.mine = a ? a.c : null; v.by = a ? a.by : null; }
    if (S.stage === 3){ const a = S.answers[p.key]; v.mine = a ? a.c : null; v.opts = S.q.opts; }
  }
  if (S.phase === 'reveal'){ v.right = p.right; v.gain = p.gain; v.ans = p.ans; v.c = S.q.c; v.newLetter = p.newLetter != null ? WORD[p.newLetter] : null;
    if (S.stage === 3) v.groupRight = S.last.groupRight; }
  if (S.phase === 'final' || S.phase === 'finalReveal' || S.phase === 'end' || (S.stage === 4 && S.phase === 'intro')){
    v.pattern = [...WORD].map((ch, i) => S.pub.includes(i) ? ch : ''); v.attempts = p.attempts; v.solved = !!p.solvedAt; v.bonus = p.bonus; v.lastWrong = p.lastWrong || null; v.len = WORD.length;
    if (S.phase !== 'final' && S.phase !== 'intro') v.word = WORD;
  }
  if (S.phase === 'board' && S.stage === 1) v.mates = teamOf(p.team).map(x => x.name);
  return v;
}
function remoteView(){
  const labels = { lobby:'Начать игру', intro: S.stage === 4 ? 'Начать финал' : 'Первый вопрос', q:'Показать ответ',
    reveal: S.qi + 1 < S.queue.length ? 'Следующий вопрос' : (S.stage === 3 ? 'К финалу' : 'Итоги этапа'),
    board: 'Этап ' + (S.stage + 1), final:'Закончить финал', finalReveal:'Итоговая таблица', end:'' };
  return { t:'v', role:'remote', phase:S.phase, stage:S.stage, code:S.code, nextLabel:labels[S.phase],
    qn:S.qi + 1, qt:S.queue.length, q: (S.phase === 'q' || S.phase === 'reveal') ? {q:S.q.q, opts:S.q.opts, c:S.q.c, theme:S.q.theme, face:!!S.q.face} : null,
    answered: S.phase === 'q' ? Object.keys(S.answers).length : 0,
    left: (S.phase === 'q' || S.phase === 'final') ? Math.max(0, S.deadline - now()) : null,
    players: S.players.map(p => ({key:p.key, name:p.name, on:online(p), bot:p.bot, themes:p.themes, ready:p.ready, team:p.team, score:p.score, letters:p.letters.length, solved:!!p.solvedAt, attempts:p.attempts})),
    word: WORD, pub:S.pub, faceRight:S.faceRight };
}
function sync(){
  renderScreen();
  if (!hub) return;
  S.players.forEach(p => { if (!p.bot && p.cid) hub.send(p.cid, playerView(p)); });
  const rv = remoteView(); S.remotes.forEach(cid => hub.send(cid, rv));
}

/* --- screen rendering --- */
function optsHTML(q, mode){
  return q.opts.map((o, i) => {
    let cls = 'opt o' + i, cnt = '';
    if (mode === 'reveal'){ cls += i === q.c ? ' win' : ' dim'; }
    if (mode === 'reveal' && S.stage === 3 && S.last) cnt = `<span class="cnt">${S.last.counts[i]}</span>`;
    return `<div class="${cls}"><span class="sh" aria-hidden="true">${SHAPES[i]}</span><span class="tx">${esc(o)}</span>${cnt}</div>`;
  }).join('');
}
function stageName(s){ return ['','Свой раунд','Командная битва','Узнай в лицо','Секретное слово'][s] || ''; }
function ctrlBar(){
  const lbl = remoteView().nextLabel;
  return `<div class="ctrl">${S.phase === 'lobby' ? '<button class="btn small ghost" id="c-bots">+ Боты для теста</button>' : ''}${lbl ? `<button class="btn small" id="c-next">${esc(lbl)} ▶</button>` : ''}</div>`;
}
function patternHTML(revealAll){
  return `<div class="tiles">${[...WORD].map((ch, i) => { const open = revealAll || S.pub.includes(i); return `<div class="tile${open ? ' open' : ''}${revealAll ? ' flip' : ''}" style="${revealAll ? `animation-delay:${i * 0.12}s` : ''}">${open ? ch : ''}</div>`; }).join('')}</div>`;
}
function renderScreen(){
  if (!S) return;
  let h = '';
  const top = (extra = '') => `<div class="tv-top"><div class="logo" style="font-size:22px">Семейный <b>код</b></div><div class="grow"></div>${extra}<span class="chip">Код ${esc(S.code)}</span></div>`;
  if (S.netError) h += `<div class="panel" style="border-color:var(--bad)">${esc(S.netError)}</div>`;
  if (S.preview && S.phase === 'lobby') h += `<div class="panel" style="border-color:var(--saffron)"><b>Предпросмотр.</b> Здесь телефоны подключиться не могут, это только для проверки. Нажмите «+ Боты для теста», затем «Начать игру» и проходите игру кнопкой «Далее».</div>`;
  if (S.phase === 'lobby'){
    const url = location.origin + location.pathname + '?role=player&code=' + S.code;
    const canQR = !IN_FRAME && !LOCAL && window.QRCode && /^https?:/.test(location.protocol);
    h += `<div class="ikat"></div>
    <div class="lobby">
      <div class="stack" style="gap:20px">
        <h1 class="logo" style="font-size:clamp(36px,5.5vw,84px)">Семейный <b>код</b></h1>
        <div class="stack" style="gap:8px">
          <span class="label">Код комнаты</span>
          <div class="code">${esc(S.code)}</div>
        </div>
        <ol style="margin:0;padding-left:1.2em;font-size:clamp(17px,1.6vw,24px);display:flex;flex-direction:column;gap:8px">
          <li>Откройте ссылку игры на телефоне${canQR ? ' или наведите камеру на QR-код' : ''}</li>
          <li>Нажмите «Игрок», введите код и имя</li>
          <li>Выберите темы, которые знаете, и нажмите «Готово»</li>
        </ol>
        ${canQR ? '<div id="qr" style="background:#fff;padding:12px;border-radius:14px;width:max-content"></div>' : ''}
      </div>
      <div class="stack">
        <div class="spread"><h2 style="font-size:clamp(22px,2.4vw,36px)">Игроки</h2><span class="chip">${S.players.filter(p => p.ready).length} из ${S.players.length} готовы</span></div>
        <div class="players">${S.players.length ? S.players.map(p => `
          <div class="pcard${p.ready ? ' ready' : ''}${online(p) ? '' : ' off'}">

  } else if (S.phase === 'intro'){

      1:['Каждый за себя. Ответ нажимаете на телефоне, вопрос смотрите на экране.','Вопрос из ваших тем даёт полные очки, из чужих тем половину. Быстрый ответ даёт больше очков.',`Каждые ${PER_LETTER} правильных ответа приносят тайную букву секретного слова. Никому её не показывайте!`],

      4:['На телефоне ваши тайные буквы, на экране открытые буквы.',`Угадайте слово целиком: 3 попытки, ${T_FINAL} секунд.`,'Первый получает +1000, второй +600, третий +300. Меняться буквами можно, но соперники тоже слушают.']
    }[S.stage];
    h += top() + `<div class="intro">
      <div class="num">Этап ${S.stage} из 4</div>

      <ul>${rules.map(r => `<li>${esc(r)}</li>`).join('')}</ul>

    </div>`;
    $app.innerHTML = `<div class="tv">${h}</div>` + ctrlBar();
  } else if (S.phase === 'q' || S.phase === 'reveal'){
    const q = S.q, isQ = S.phase === 'q';
    const left = Math.max(0, S.deadline - now());
    const themeChip = q.theme ? `<span class="chip">${THEMES[q.theme].i} ${THEMES[q.theme].n}</span>` : '';
    h += top(`<span class="chip">${stageName(S.stage)}</span>${themeChip}<span class="chip">${S.qi + 1} / ${S.queue.length}</span>${isQ ? `<span class="tleft" id="tleft">${Math.ceil(left / 1000)}</span>` : ''}`);
    h += isQ ? `<div class="timer"><i id="tbar" style="width:${100 * left / (S.qT * 1000)}%"></i></div>` : `<div class="timer"><i style="width:0"></i></div>`;
    if (S.stage === 3){
      h += `<div class="facegrid"><img class="face" src="${PHOTOS[q.face] || ''}" alt="Фото для угадывания"><div class="stack" style="gap:16px"><div class="qtext">${esc(q.q)}</div><div class="opts">${optsHTML(q, isQ ? 'q' : 'reveal')}</div></div></div>`;
    } else {
      h += `<div class="qtext">${esc(q.q)}</div><div class="opts">${optsHTML(q, isQ ? 'q' : 'reveal')}</div>`;
    }
    if (isQ){
      const names = S.stage === 2 ? [0,1].filter(t => S.answers['T' + t]).map(t => `<span class="chip team${t}">${TEAMS[t].n} ответила ✓</span>`)
        : S.players.filter(p => S.answers[p.key]).map(p => `<span class="chip ok">${esc(p.name)} ✓</span>`);
      h += `<div class="spread"><div class="results">${names.join('') || '<span class="muted" style="font-size:18px">Ждём ответы…</span>'}</div><span class="muted">${S.stage === 3 ? 'Голосуйте на телефонах' : 'Отвечайте на телефонах'}</span></div>`;
    } else {
      if (S.stage === 1){
        h += `<div class="results">${S.players.map(p => `<span class="res ${p.right ? 'good' : 'miss'}">${p.right ? '✓' : (p.ans == null ? '—' : '✗')} ${esc(p.name)}${p.right ? ` <span class="pts">+${p.gain}</span>` : ''}${p.newLetter != null ? ' 🔒 новая буква' : ''}</span>`).join('')}</div>`;
      } else if (S.stage === 2){
        h += `<div class="teams">${[0,1].map(t => { const r = S.last.teamRes[t]; return `<div class="team t${t}"><h3>${TEAMS[t].n}</h3><p style="font-size:clamp(17px,1.8vw,26px)">${!r ? 'Не успели ответить' : r.right ? `Верно! Каждому +${r.pts} · ответил(а) ${esc(r.by)}` : `Мимо · ответил(а) ${esc(r.by)}`}</p></div>`; }).join('')}</div>`;
        const got = S.players.filter(p => p.newLetter != null); if (got.length) h += `<div class="results">${got.map(p => `<span class="res good">🔒 ${esc(p.name)} получает букву</span>`).join('')}</div>`;
      } else {
        const toNext = FACES_PER_LETTER - (S.faceRight % FACES_PER_LETTER);
        h += `<div class="spread"><h2 style="font-size:clamp(22px,2.6vw,40px);color:${S.last.groupRight ? 'var(--ok)' : 'var(--bad)'}">${S.last.groupRight ? 'Семья угадала!' : 'Не угадали'}</h2>
          <span class="chip">Угадано ${S.faceRight} · ${S.pub.length >= MAX_PUBLIC ? 'все буквы этапа открыты' : (S.last.opened != null ? 'открыта новая буква!' : `до буквы ${toNext}`)}</span></div>${patternHTML(false)}`;
      }
    }
    $app.innerHTML = `<div class="tv">${h}</div>` + ctrlBar();
  } else if (S.phase === 'board'){
    h += top(`<span class="chip">Итоги этапа ${S.stage}</span>`) + `<h1 style="font-size:clamp(30px,4vw,64px)">Таблица после этапа ${S.stage}</h1>`;
    h += `<div class="board">${ranking().map((p, i) => `<div class="brow"><span class="rk">${i + 1}</span><span class="nm">${esc(p.name)}${p.team != null && S.stage === 1 ? ` <span class="chip team${p.team}" style="font-size:13px">${TEAMS[p.team].n}</span>` : ''}</span><span class="sc">${fmt(p.score)}</span></div>`).join('')}</div>`;
    if (S.stage === 1) h += `<p class="muted" style="font-size:18px">Команды на этап 2 составлены по очкам, чтобы силы были равны. Ведущий может поменять их на пульте.</p>`;
    $app.innerHTML = `<div class="tv">${h}</div>` + ctrlBar();
  } else if (S.phase === 'final'){
    const left = Math.max(0, S.deadline - now());
    h += top(`<span class="chip">Финал</span><span class="tleft" id="tleft">${Math.ceil(left / 1000)}</span>`) + `<div class="timer"><i id="tbar" style="width:${100 * left / (S.qT * 1000)}%"></i></div>`;
    h += `<div class="intro" style="max-width:none;align-items:center;text-align:center"><h1 style="font-size:clamp(30px,4.5vw,72px)">Какое слово спрятано?</h1>${patternHTML(false)}
      <div class="results" style="justify-content:center">${S.players.map(p => `<span class="res ${p.solvedAt ? 'good' : ''}">${esc(p.name)} · ${p.solvedAt ? `разгадал(а)! <span class="pts">+${p.bonus}</span>` : p.attempts >= 3 ? 'попытки кончились' : `попыток: ${3 - p.attempts}`}</span>`).join('')}</div></div>`;
    $app.innerHTML = `<div class="tv">${h}</div>` + ctrlBar();
  } else if (S.phase === 'finalReveal'){
    const solvers = S.solved.map(k => S.players.find(p => p.key === k)).filter(Boolean);
    h += top() + `<div class="intro" style="max-width:none;align-items:center;text-align:center"><div class="num">Секретное слово</div>${patternHTML(true)}
      <p style="font-size:clamp(18px,2vw,30px)">${solvers.length ? solvers.map((p, i) => `${i + 1}. ${esc(p.name)} <b style="color:var(--saffron)">+${p.bonus}</b>`).join(' · ') : 'Никто не разгадал. Дастархан, за которым собирается вся семья!'}</p></div>`;
    $app.innerHTML = `<div class="tv">${h}</div>` + ctrlBar();
  } else if (S.phase === 'end'){
    const r = ranking(); const podium = [r[1], r[0], r[2]];
    h += `<div class="ikat"></div><h1 class="logo" style="font-size:clamp(34px,5vw,80px);text-align:center">Победители</h1>
    <div class="podium">${podium.map((p, i) => p ? `<div class="pod p${[2,1,3][i]}"><span class="medal">${[2,1,3][i]}</span><span class="nm">${esc(p.name)}</span><span class="muted">${fmt(p.score)} очков</span></div>` : '').join('')}</div>
    <div class="board" style="margin:0 auto">${r.slice(3).map((p, i) => `<div class="brow"><span class="rk">${i + 4}</span><span class="nm">${esc(p.name)}</span><span class="sc">${fmt(p.score)}</span></div>`).join('')}</div>
    <p class="muted" style="text-align:center;font-size:20px">Спасибо за игру! 💛</p>`;
    $app.innerHTML = `<div class="tv">${h}</div>`;
  }
  const b = document.getElementById('c-next'); if (b) b.onclick = next;
  const bb = document.getElementById('c-bots'); if (bb) bb.onclick = addBots;
}

/* ================= CLIENTS (player & remote) ================= */
let C = null;
function startClient(role, presetCode){
  const pid = store.get('semkod-pid') || Math.random().toString(36).slice(2, 10); store.set('semkod-pid', pid);
  C = { role, code: presetCode || '', name: store.get('semkod-name') || '', pid, link:null, v:null, status:'idle', err:null, sel:new Set(), sentReady:false, guessText:'' };
  renderJoin();
}
function renderJoin(){
  const isP = C.role === 'player';
  $app.innerHTML = `<div class="phone">
    <div class="ikat"></div>
    <h1 class="logo" style="font-size:34px">${isP ? 'Вход в <b>игру</b>' : 'Пульт <b>ведущего</b>'}</h1>
    <form id="jf" class="stack" novalidate>
      <label class="stack" style="gap:6px"><span class="label">Код с экрана</span><input id="j-code" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4821" value="${esc(C.code)}"></label>
      ${isP ? `<label class="stack" style="gap:6px"><span class="label">Ваше имя</span><input id="j-name" maxlength="20" autocomplete="nickname" placeholder="Например, Мадина" value="${esc(C.name)}"></label>` : ''}
      ${C.err ? `<p style="color:var(--bad);font-weight:600">${esc(C.err)}</p>` : ''}
      <button class="btn wide" type="submit">${isP ? 'Войти' : 'Подключить пульт'}</button>
      <button class="btn ghost wide" type="button" id="j-back">Назад</button>
    </form></div>`;
  document.getElementById('j-back').onclick = home;
  document.getElementById('jf').onsubmit = e => {
    e.preventDefault();
    const code = document.getElementById('j-code').value.replace(/\D/g, '');
    const nameEl = document.getElementById('j-name');
    const name = nameEl ? nameEl.value.trim() : '';
    if (code.length !== 4){ C.err = 'Код состоит из 4 цифр, он показан на экране'; renderJoin(); return; }
    if (isP && !name){ C.err = 'Введите имя'; renderJoin(); return; }
    C.code = code; C.name = name; C.err = null; if (isP) store.set('semkod-name', name);
    connectClient();
  };
}
function connectClient(){
  C.status = 'connecting'; renderClient();
  const go = () => {
    C.link = createLink(C.code, {
      onOpen(){ C.link.send({t:'join', role:C.role, name:C.name, pid:C.pid}); },
      onMsg(m){
        if (m.t === 'v'){ C.v = m; C.vAt = now(); C.status = 'open'; renderClient(); }
        else if (m.t === 'err'){ C.err = m.m; C.link = null; renderJoin(); }
      },
      onStatus(s){ if (s === 'open') return; C.status = s; renderClient(); }
    });
    setInterval(() => C.link && C.link.send({t:'ping'}), 4000);
  };
  if (LOCAL) go(); else loadPeer().then(go).catch(() => { C.status = 'noload'; renderClient(); });
}
let clientTimer = null;
function leftNow(){ return C.v && C.v.left != null ? Math.max(0, C.v.left - (now() - C.vAt)) : null; }
function statusLine(){
  const map = { connecting:'Подключаемся…', lost:'Связь пропала, переподключаемся…', nohost:'Экран с таким кодом не найден. Проверьте код на телевизоре.', noload:'Нет интернета: не удалось загрузить игру.', incompatible:'Этот браузер не поддерживает игру. Откройте ссылку в Chrome или Safari.' };
  return map[C.status] || '';
}
function renderClient(){
  clearInterval(clientTimer);
  if (!C.v){
    const s = statusLine();
    $app.innerHTML = `<div class="phone"><div class="bigmsg"><div class="emo">📡</div><h2>${esc(s || 'Подключаемся…')}</h2><p class="muted">Код ${esc(C.code)}</p><button class="btn ghost" id="b-back">Изменить код</button></div></div>`;
    document.getElementById('b-back').onclick = () => { C.link = null; C.v = null; renderJoin(); };
    return;
  }
  if (C.role === 'remote') return renderRemote();
  renderPlayer();
}
function head(v){
  return `<div class="ph-head"><span class="nm">${esc(v.name)}${v.team != null && v.stage >= 2 ? ` <span class="chip team${v.team}" style="font-size:12px;padding:3px 8px">${TEAMS[v.team].n}</span>` : ''}</span><span class="sc">${fmt(v.score)}</span></div>
  ${C.status !== 'open' ? `<div class="banner" style="border-color:var(--bad)">${esc(statusLine())}</div>` : ''}`;
}
function lettersHTML(v){
  if (!v.letters.length) return `<p class="muted" style="text-align:center">Тайных букв пока нет${v.toLetter ? ` · до первой: ${v.toLetter} ${plural(v.toLetter,'правильный ответ','правильных ответа','правильных ответов')}` : ''}</p>`;
  return `<div class="stack" style="gap:8px;align-items:center"><span class="label">Твои тайные буквы</span><div class="mytiles">${v.letters.map(l => `<div class="tile open">${esc(l)}</div>`).join('')}</div>${v.toLetter ? `<span class="muted" style="font-size:14px">До следующей: ${v.toLetter} ${plural(v.toLetter,'правильный ответ','правильных ответа','правильных ответов')}</span>` : '<span class="muted" style="font-size:14px">Это максимум букв</span>'}</div>`;
}
function renderPlayer(){
  const v = C.v; let h = head(v);
  if (v.phase === 'lobby'){
    if (!C.sentReady && !C.selInit){ C.sel = new Set(v.themes); C.selInit = true; }
    h += `<div class="stack" style="gap:6px"><h2 style="font-size:24px">Какие темы ты знаешь?</h2><p class="muted">Выбери одну или несколько. Вопросы из твоих тем дают полные очки.</p></div>
      <div class="themes">${Object.entries(THEMES).map(([k, t]) => `<button class="theme" data-t="${k}" aria-pressed="${C.sel.has(k)}"><span class="ic">${t.i}</span><span class="tn">${t.n}</span></button>`).join('')}</div>
      ${v.ready ? `<div class="banner own">Готово! Ждём ведущего. Темы можно поменять до старта.</div>` : ''}
      <button class="btn wide" id="b-ready" ${C.sel.size ? '' : 'disabled'}>${v.ready ? 'Обновить темы' : 'Готово'}</button>`;
    $app.innerHTML = `<div class="phone">${h}</div>`;
    document.querySelectorAll('.theme').forEach(b => b.onclick = () => { const t = b.dataset.t; C.sel.has(t) ? C.sel.delete(t) : C.sel.add(t); b.setAttribute('aria-pressed', C.sel.has(t)); document.getElementById('b-ready').disabled = !C.sel.size; });
    document.getElementById('b-ready').onclick = () => { C.sentReady = true; C.link.send({t:'themes', themes:[...C.sel], ready:true}); };
    return;
  }
  if (v.phase === 'intro'){
    const txt = {1:'Смотри на экран: вопросы там, а здесь только кнопки.',2:'Ты в команде «' + (v.team != null ? TEAMS[v.team].n : '') + '». Советуйтесь: отвечает тот, кто нажмёт первым.',3:'Все вместе! Голосуйте за имя, засчитается ответ большинства.',4:'Готовься угадать слово по своим буквам!'}[v.stage];
    h += `<div class="bigmsg"><div class="emo">📺</div><span class="label">Этап ${v.stage}</span><h2>${stageName(v.stage)}</h2><p class="muted" style="font-size:18px">${esc(txt)}</p></div>${lettersHTML(v)}`;
    $app.innerHTML = `<div class="phone">${h}</div>`; return;
  }
  if (v.phase === 'q'){
    let banner = '';
    if (v.stage === 1) banner = v.own ? `<div class="banner own">${THEMES[v.theme].i} Твоя тема: полные очки</div>` : `<div class="banner">${THEMES[v.theme].i} Не твоя тема: половина очков</div>`;
    if (v.stage === 2) banner = `<div class="banner t${v.team}">${v.mine != null ? `Команда ответила${v.by ? ' (' + esc(v.by) + ')' : ''}` : 'Один ответ за всю команду. Советуйтесь!'}</div>`;

    const locked = v.mine != null && v.stage !== 3;
    h += `${banner}<div class="spread"><span class="muted">Вопрос ${v.qn} из ${v.qt}</span><span class="tleft" id="ptl" style="font-size:24px">${Math.ceil((leftNow() || 0) / 1000)}</span></div>
      <div class="pad${locked ? ' locked' : ''}">${[0,1,2,3].map(i => `<button class="o${i}${v.mine === i ? ' sel' : ''}" data-c="${i}" aria-label="Ответ ${SHAPES[i]}${v.opts ? ': ' + esc(v.opts[i]) : ''}"><span aria-hidden="true">${SHAPES[i]}</span>${v.opts ? `<span class="tx">${esc(v.opts[i])}</span>` : ''}</button>`).join('')}</div>
      ${locked ? '<p class="muted" style="text-align:center">Ответ принят. Смотри на экран!</p>' : ''}`;

      : (v.right ? ['✅','Верно! +' + v.gain, v.stage === 2 ? 'Очки получил каждый в команде' : ''] : [v.ans == null ? '⏰' : '❌', v.ans == null ? 'Не успел(а)' : 'Мимо', 'Правильный ответ: ' + SHAPES[v.c]]);
    h += `<div class="bigmsg"><div class="emo">${msg[0]}</div><h2>${esc(msg[1])}</h2>${msg[2] ? `<p class="muted" style="font-size:18px">${esc(msg[2])}</p>` : ''}<p class="muted">Ты на ${v.rank}-м месте из ${v.total}</p></div>

    $app.innerHTML = `<div class="phone">${h}</div>`; return;
  }
  if (v.phase === 'final'){
    const pat = `<div class="tiles">${v.pattern.map(ch => `<div class="tile${ch ? ' open' : ''}" style="width:32px;font-size:20px">${esc(ch)}</div>`).join('')}</div>`;

    if (v.solved) body = `<div class="bigmsg"><div class="emo">🎉</div><h2>Разгадал(а)! +${v.bonus}</h2><p class="muted">Молчи до конца финала!</p></div>`;
    else if (v.attempts >= 3) body = `<div class="bigmsg"><div class="emo">🤐</div><h2>Попытки закончились</h2><p class="muted">Смотри на экран, сейчас откроем слово.</p></div>`;
    else body = `<form id="gf" class="stack" novalidate><label class="stack" style="gap:6px"><span class="label">Твой ответ · ${v.len} букв</span><input id="g-word" autocomplete="off" autocapitalize="characters" maxlength="20" value="${esc(C.guessText)}" placeholder="Слово целиком"></label>
      ${v.lastWrong ? `<p style="color:var(--bad);font-weight:600">«${esc(v.lastWrong)}» — не то. Осталось попыток: ${3 - v.attempts}</p>` : `<p class="muted">Попыток: ${3 - v.attempts}</p>`}
      <button class="btn wide" type="submit">Отправить</button></form>`;
    h += `<div class="spread"><span class="label">Финал</span><span class="tleft" id="ptl" style="font-size:24px">${Math.ceil((leftNow() || 0) / 1000)}</span></div>${pat}${lettersHTML(v)}${body}`;
    const focused = document.activeElement && document.activeElement.id === 'g-word';
    $app.innerHTML = `<div class="phone">${h}</div>`;
    const inp = document.getElementById('g-word');
    if (inp){ inp.oninput = () => C.guessText = inp.value; if (focused) inp.focus(); }
    const f = document.getElementById('gf'); if (f) f.onsubmit = e => { e.preventDefault(); const w = inp.value.trim(); if (!w) return; C.link.send({t:'guess', word:w}); C.guessText = ''; inp.value = ''; };
    clientTimer = setInterval(() => { const el = document.getElementById('ptl'); if (el) el.textContent = Math.ceil((leftNow() || 0) / 1000); }, 250);
    return;
  }
  if (v.phase === 'finalReveal' || v.phase === 'end'){
    h += `<div class="bigmsg"><div class="emo">${v.rank === 1 ? '🥇' : v.rank === 2 ? '🥈' : v.rank === 3 ? '🥉' : '🎈'}</div><span class="label">Секретное слово</span><h2 style="color:var(--saffron)">${esc(v.word || '')}</h2>
      <p style="font-size:20px;font-weight:700">${v.phase === 'end' ? 'Итог: ' : ''}${v.rank}-е место · ${fmt(v.score)} ${plural(v.score,'очко','очка','очков')}</p><p class="muted">Спасибо за игру!</p></div>`;
    $app.innerHTML = `<div class="phone">${h}</div>`; return;
  }
}
function renderRemote(){
  const v = C.v;
  const editTeams = v.phase === 'lobby' || v.phase === 'board' || (v.phase === 'intro' && v.stage === 2);
  let h = `<div class="ph-head"><span class="nm">Пульт · код ${esc(v.code)}</span><span class="chip">${v.stage ? 'Этап ' + v.stage : 'Лобби'}</span></div>
    ${C.status !== 'open' ? `<div class="banner" style="border-color:var(--bad)">${esc(statusLine())}</div>` : ''}`;
  if (v.nextLabel) h += `<button class="btn wide" id="r-next" style="font-size:22px;padding:20px">${esc(v.nextLabel)} ▶</button>`;
  if (v.q){
    h += `<div class="panel stack" style="gap:8px"><div class="spread"><span class="label">Вопрос ${v.qn} из ${v.qt}${v.q.theme ? ' · ' + THEMES[v.q.theme].n : ''}</span>${v.phase === 'q' ? `<span class="chip">Ответили: ${v.answered}</span>` : ''}</div>
      <p style="font-weight:700;font-size:18px">${esc(v.q.q)}</p>
      <div class="answer-key">${SHAPES[v.q.c]} ${esc(v.q.opts[v.q.c])}</div></div>`;
  }
  if (v.phase === 'final' || v.phase === 'intro' && v.stage === 4) h += `<div class="panel">Слово: <b style="font-family:var(--display);color:var(--saffron)">${esc(v.word)}</b> · открыто букв: ${v.pub.length}</div>`;
  if (v.stage === 3 || v.phase === 'intro' && v.stage === 4) h += `<p class="muted">Угадано лиц: ${v.faceRight}</p>`;
  h += `<div class="spread"><span class="label">Игроки · ${v.players.length}</span>${editTeams && v.stage >= 1 ? '<button class="btn small ghost" id="r-shuffle">Перемешать команды</button>' : ''}${v.phase === 'lobby' ? '<button class="btn small ghost" id="r-bots">+ Боты для теста</button>' : ''}</div>
    <div class="rm-list">${v.players.map(p => `<div class="rm-p"><span class="row" style="gap:8px;min-width:0"><span class="dot${p.on ? '' : ' off'}" title="${p.on ? 'в сети' : 'не в сети'}"></span><b style="overflow-wrap:anywhere">${esc(p.name)}</b><span class="muted" style="font-size:14px">${v.phase === 'lobby' ? (p.themes.map(t => THEMES[t].i).join('') || '…') + (p.ready ? ' ✓' : '') : fmt(p.score) + ' · 🔒' + p.letters}</span></span>
      ${editTeams && v.stage >= 1 && p.team != null ? `<button class="chip team${p.team}" data-team="${esc(p.key)}" style="cursor:pointer;color:var(--text)">${TEAMS[p.team].n} ⇄</button>` : ''}
      ${v.phase === 'lobby' ? `<button class="btn small ghost" data-kick="${esc(p.key)}" aria-label="Убрать ${esc(p.name)}">✕</button>` : ''}</div>`).join('') || '<p class="muted">Пока никого</p>'}</div>`;
  if (v.phase === 'lobby') h += `<p class="muted" style="font-size:14px">Когда все нажмут «Готово», жмите «Начать игру». Команды составятся автоматически после этапа 1.</p>`;
  $app.innerHTML = `<div class="phone">${h}</div>`;
  const send = (c, extra) => C.link.send(Object.assign({t:'cmd', c}, extra || {}));
  const nb = document.getElementById('r-next'); if (nb) nb.onclick = () => { nb.disabled = true; send('next'); };
  const sb = document.getElementById('r-shuffle'); if (sb) sb.onclick = () => send('shuffleTeams');
  const bb = document.getElementById('r-bots'); if (bb) bb.onclick = () => send('bots');
  document.querySelectorAll('[data-team]').forEach(b => b.onclick = () => send('team', {key:b.dataset.team}));
  document.querySelectorAll('[data-kick]').forEach(b => b.onclick = () => send('kick', {key:b.dataset.kick}));
}

/* ================= BOOT ================= */
const P = params();
if (P.get('role') === 'player') startClient('player', (P.get('code') || '').replace(/\D/g, '').slice(0, 4));
else if (P.get('role') === 'screen') startScreen();
else home();
// expose for local testing
window.__semkod = { get S(){ return S; }, next: () => next() };
})();
</script>

</body>
</html>
